<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发环节 · 模型选择</title>
<style>
:root{color-scheme:light;--bg:#fbfcfa;--surface:#fff;--ink:#202b29;--muted:#52615d;--line:#dbe2dd;--soft:#f0f4f0;--accent:#18654c;--accent-ink:#fff;--error:#9e3131;--focus:#268267}
:root[data-theme=dark]{color-scheme:dark;--bg:#19211f;--surface:#222c28;--ink:#e8efea;--muted:#b2c1b7;--line:#405047;--soft:#2d3a32;--accent:#a9dfbe;--accent-ink:#163323;--error:#ffb4ab;--focus:#a9dfbe}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{padding:22px;max-width:1040px;margin:auto}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font:11px/1.5 ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);margin:0 0 7px}h1{font-size:20px;line-height:1.4;font-weight:650;letter-spacing:-.02em;margin:0}h2{font-size:14px;font-weight:600;margin:0}.caption{margin:5px 0 0;color:var(--muted);font-size:12px}.badge{padding:4px 9px;border:1px solid var(--line);border-radius:6px;white-space:nowrap;font-size:12px;background:var(--surface)}.task{padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:6px;margin-bottom:16px;overflow-wrap:anywhere}.task p{margin:4px 0 0;font-size:11px;color:var(--muted)}table{border-collapse:collapse;table-layout:fixed;width:100%;text-align:left}caption{text-align:left;color:var(--muted);font-size:12px;padding:0 0 9px}thead{color:var(--muted);font-size:11px;font-weight:500}th,td{border-bottom:1px solid var(--line);padding:13px 10px;vertical-align:top}thead th{padding-top:7px;padding-bottom:8px;font-weight:500}th:first-child,td:first-child{width:54px;text-align:center;padding-left:0;padding-right:8px}th:nth-child(2){width:40%}td:last-child{padding-right:0}.stage-name{font-weight:650;font-size:14px}.reason{color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}.required{font-size:10px;display:inline-block;background:var(--soft);color:var(--muted);padding:1px 5px;border-radius:3px;margin-left:6px}.model-detail{color:var(--muted);font-size:11px;margin:5px 0 0;overflow-wrap:anywhere}input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:4px 0 0;cursor:pointer}select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:38px;width:100%;max-width:100%;padding:7px 27px 7px 9px;cursor:pointer}button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:9px 14px;min-height:38px;background:var(--surface);color:var(--ink);cursor:pointer}button:hover:not(:disabled){background:var(--soft)}button.primary{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}button.primary:hover:not(:disabled){filter:brightness(1.08)}button:disabled,select:disabled{cursor:not-allowed;opacity:.64}input:disabled{cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}tr[data-enabled=false] .stage-name{text-decoration:line-through;color:var(--muted)}tr[data-enabled=false] .reason{opacity:.8}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}#summary{font-size:12px;color:var(--muted);margin:0}#status{font-size:12px;color:var(--muted);margin:12px 0 0;min-height:19px;overflow-wrap:anywhere}#status[data-error=true]{color:var(--error)}#refresh{font-size:11px;padding:3px 0;min-height:25px;background:transparent;border:none;text-decoration:underline;color:var(--muted)}.fineprint{font-size:11px;line-height:1.5;color:var(--muted);margin:8px 0 0}.empty{padding:25px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;margin-top:10px}[hidden]{display:none!important}
@media(max-width:520px){main{padding:16px}h1{font-size:18px}th,td{padding-left:7px;padding-right:7px}th:first-child,td:first-child{width:35px}th:nth-child(2){width:38%}.footer{align-items:stretch;flex-direction:column}.actions{justify-content:flex-end}select{font-size:12px}.badge{font-size:11px;padding:3px 6px}.reason{font-size:11px}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">SDLC / EXECUTION SETUP</p><h1>选择开发环节与模型</h1><p class="caption">已为各环节选好推荐模型，你可以随时调整。</p></div><span class="badge" id="badge">等待连接</span></header>
<section class="task" aria-label="本次任务"><h2 id="task-title">正在读取任务</h2><p id="catalog">模型列表由主会话从 Qoder 当前目录获取</p></section>
<form id="selection-form">
<table aria-label="开发环节模型选择"><caption>勾选要执行的环节，再从下拉框选择模型。</caption><thead><tr><th scope="col">执行</th><th scope="col">开发环节</th><th scope="col">使用模型</th></tr></thead><tbody id="stage-body"></tbody></table>
<div class="empty" id="empty">等待主会话提供本次任务的环节与模型列表。</div>
<div class="footer"><p id="summary">尚未执行任何任务</p><div class="actions"><button type="button" id="cancel" disabled>取消</button><button type="button" class="primary" id="confirm" disabled>确认并继续</button></div></div>
</form>
<p id="status" role="status" aria-live="polite">正在连接 Qoder…</p>
<button id="refresh" type="button" disabled>刷新选择状态</button>
<p class="fineprint">推荐预选不是授权。点击确认后，主会话才会核对条件并调度；生产发布仍需单独授权。</p>
</main>
<script>/* APP_SCRIPT */</script>
</body>
</html>
